name: Correos programados

on:
  schedule:
    - cron: '0 15 * * 0'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Qué envío ejecutar'
        required: true
        default: semanal
        type: choice
        options: [semanal, diaria]

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL_API: ${{ secrets.URL_API }}
      TOKEN_TAREAS: ${{ secrets.TOKEN_TAREAS }}
    steps:
      - name: Elegir el envío
        id: tipo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tipo=${{ inputs.tipo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 0" ]; then
            echo "tipo=semanal" >> "$GITHUB_OUTPUT"
          else
            echo "tipo=diaria" >> "$GITHUB_OUTPUT"
          fi
      - name: Enviar
        if: ${{ env.URL_API != '' && env.TOKEN_TAREAS != '' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$URL_API/api/correos/tareas/${{ steps.tipo.outputs.tipo }}" \
            -H "Authorization: Bearer $TOKEN_TAREAS" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Sin configurar
        if: ${{ env.URL_API == '' || env.TOKEN_TAREAS == '' }}
        run: echo "Faltan los secretos URL_API y TOKEN_TAREAS; no se envió nada."
