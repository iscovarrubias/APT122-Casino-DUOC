<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f3f5f8}
body{font-family:Poppins,system-ui,sans-serif;color:#0a2239;-webkit-font-smoothing:antialiased}
#escena{position:absolute;inset:0;overflow:hidden}
#fondo{position:absolute;inset:0;background:#f3f5f8}
.abs{position:absolute;left:0;top:0}

.toque{position:absolute;border-radius:50%;border:10px solid #fbb930;opacity:0}

#estrellas{display:flex;gap:22px}

<script>
const G = window.GEO;

const AMARILLO = '#fbb930', AZUL = '#0a2239', CLARO = '#f3f5f8';
const CAT = [['General', '#F5A623'], ['JUNAEB', '#D11B1B'], ['Vegetariano', '#3C7424'], ['Hipocalórico', '#318386']];
const $ = (id) => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;

const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eExpo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const eIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eBack = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function bez(x1, y1, x2, y2) {
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; const bx = 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t; if (bx < x) lo = t; else hi = t; }
    return 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  };
}
const BZ = bez(0.22, 0.8, 0.3, 1);

  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
};
const set = (el, css) => { for (const k in css) el.style[k] = css[k]; };

function armarTel(id, angulo, pantallas) {

    el.appendChild(m); el.__movil = m;

  const cu = document.createElement('div'); cu.className = 'cuerpo'; set(cu, { position: 'absolute', left: g.bx + 'px', top: g.by + 'px', width: g.bw + 'px', height: g.bh + 'px' }); el.appendChild(cu); el.__cuerpo = cu;
  const t = document.createElement('div'); t.className = 'toque'; el.appendChild(t); el.__toque = t;
  el.__g = g;
  return el;
}
function telPos(el, x, y, alto, rot = 0, op = 1, blur = 0) {
  const g = el.__g, s = alto / g.bh;
  set(el, { transform: `translate(${x}px,${y}px) rotate(${rot}deg) scale(${s}) translate(${-g.cx}px,${-g.cy}px)`, opacity: op, filter: blur > 0.05 ? `blur(${blur}px)` : 'none', display: op <= 0 ? 'none' : 'block' });
  el.__s = s; el.__x = x; el.__y = y; el.__rot = rot;
}
function pantallas(el, pesos) {
  for (const k in el.__img) el.__img[k].style.opacity = pesos[k] || 0;
}
const SX = 907, KX = 978 / 440, KY = 2128 / 956, SY = 32 + 57 * KY;
function puntoTel(el, px, py) {
  const g = el.__g, s = el.__s, r = (el.__rot * Math.PI) / 180;
  const lx = (SX + px * KX - g.cx) * s, ly = (SY + py * KY - g.cy) * s;
  return [el.__x + lx * Math.cos(r) - ly * Math.sin(r), el.__y + lx * Math.sin(r) + ly * Math.cos(r)];
}
function toque(el, px, py, t, t0, crudo) {
  const k = pr(t, t0, t0 + 0.5);
  const d = el.__toque;
  if (k <= 0 || k >= 1) { d.style.opacity = 0; return; }
  const r = lerp(30, 120, eOut(k));
  set(d, { left: SX + px * KX - r + 'px', top: (crudo ? 32 : SY) + py * KY - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: 1 - k });
}
function cargando(el, t, x, y, ancho, conBarra) {
  if (!el.__ok) {
    el.innerHTML = '<div style="position:absolute;inset:0" class="logo"><div class="capa c1"></div><div class="capa c2"></div><div class="capa c3"></div><div class="capa c4"></div></div><div class="pista"><span></span></div>';
    el.__ok = true;
  }
  const alto = (ancho * 607) / 1400;
  set(el, { left: x - ancho / 2 + 'px', top: y - alto / 2 + 'px', width: ancho + 'px', height: alto + 'px', display: t < 0 ? 'none' : 'block' });
  const [c1, c2, c3, c4] = el.querySelectorAll('.capa');
  const ola = BZ(pr(t, 0.05, 0.55));
  set(c1, { clipPath: `inset(0 ${100 - ola * 100}% 0 0)`, opacity: ola, transform: `translateY(${(1 - ola) * 14}%)` });

function estrella(lleno) {
  return `<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z" fill="${lleno ? AMARILLO : 'none'}" stroke="${AMARILLO}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

const tel4 = armarTel('tel4', 4, ['tel-general', 'tel-cat-1', 'tel-cat-2', 'tel-cat-3', 'tel-quedan-5', 'tel-quedan-4', 'tel-quedan-3', 'tel-reloj', 'tel-agotado', 'tel-cuenta', 'tel-fav', 'tel-alergeno', 'tel-estrellas-0', 'tel-estrellas-1', 'tel-estrellas-2', 'tel-estrellas-3', 'tel-estrellas-4', 'tel-estrellas-5', 'tel-comentario-03', 'tel-comentario-06', 'tel-comentario-10']);
const tel3 = armarTel('tel3', 3, ['tel-general']);
const corazones = $('corazones');
const CORAZONES = Array.from({ length: 14 }, (_, i) => {
  const d = document.createElement('div'); d.className = 'corazon';
  d.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z" fill="' + (i % 3 ? '#e5484d' : AMARILLO) + '"/></svg>';

  let fondo = CLARO;

    pes['tel-general'] = 1;
    const n = Math.floor(cl((t - 0.95) / 0.048, 0, URL_TXT.length));
    $('m-url').innerHTML = n ? URL_TXT.slice(0, n) : t > 0.75 ? '' : '<span class="ph">Buscar o ingresar dirección</span>';
    $('m-caret').style.display = t > 0.75 && t < 2.5 && (n > 0 || Math.floor(t * 2.4) % 2 === 0) ? 'inline-block' : 'none';
